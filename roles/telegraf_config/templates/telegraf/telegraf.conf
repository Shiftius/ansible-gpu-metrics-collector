## Configure Telegraf Global Tags
[global_tags]

## Configure Telegraf Agent
[agent]
  interval = "30s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "15s"
  flush_jitter = "0s"
  precision = ""
  hostname = "${LP_STACK_NAME}"
  omit_hostname = false
  logfile = "/var/log/telegraf/telegraf.log"

## Configure Telegraf Inputs

[[inputs.cpu]]
  percpu = false
[[inputs.disk]]
 ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs", "shm"]
[[inputs.diskio]]
 devices = ["sd*", "vd*", "nv*"]
[[inputs.net]]
[[inputs.mem]]
[[inputs.system]]
[[inputs.nvidia_smi]]
[[inputs.procstat]]
  pattern = "cloudflared"

## Configure Telegraf Outputs
[[outputs.influxdb_v2]]
  ## The URLs of the InfluxDB cluster nodes.
  ##
  ## Multiple URLs can be specified for a single cluster, only ONE of the
  ## urls will be written to each interval.
  ##   ex: urls = ["https://us-west-2-1.aws.cloud2.influxdata.com"]
  urls = ["http://127.0.0.1:8086"]

  ## Token for authentication.
  token = "{{ metrics_secrets.INFLUX_OPERATOR_TOKEN }}"

  ## Organization is the name of the organization you wish to write to.
  organization = "{{ influx.org }}"

  ## Destination bucket to write into.
  bucket = "{{ influx.bucket }}"
