---
# tasks file for telegraf_config

- name: Load environment facts
  include_tasks: tasks/env_facts.yml

- name: Set system hostname
  hostname:
    name: "{{ host_prefix }}-{{ hostid }}"
  register: hostname_result
  when: not skip_hostname_conf | bool

### Pkg: influxdata prereq

- name: Remove existing InfluxData repository configurations
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/influxdata.list
    - /etc/apt/sources.list.d/influxdb.list
    - /etc/apt/keyrings/influxdata-apt-keyring.asc
    - /etc/apt/keyrings/influxdata.gpg
  ignore_errors: true

- name: Add InfluxData repository key
  shell: |
    curl -sSL https://repos.influxdata.com/influxdata-archive.key | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/influxdata-archive_compat.gpg > /dev/null
  args:
    creates: /etc/apt/trusted.gpg.d/influxdata-archive_compat.gpg

- name: Add InfluxData repository source list
  apt_repository:
    repo: "deb [signed-by=/etc/apt/trusted.gpg.d/influxdata-archive_compat.gpg] https://repos.influxdata.com/debian stable main"
    filename: influxdata
    state: present
  register: influx_repo
  retries: 10
  until: influx_repo is success

### Pkg: grafana prereq

- name: Remove existing Grafana repository configurations
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/grafana.list
    - /etc/apt/keyrings/grafana.asc
    - /etc/apt/keyrings/grafana.key
    - /usr/share/keyrings/grafana.key
    - /usr/share/keyrings/grafana.asc
  ignore_errors: true

- name: Add Grafana repository key
  shell: |
    curl -s https://apt.grafana.com/gpg.key > /usr/share/keyrings/grafana.key
  register: key_result_grafana
  changed_when: key_result_grafana.stdout != ""
  failed_when: key_result_grafana.stderr != ""

- name: Add Grafana repository source list
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/grafana.key] https://apt.grafana.com stable main"
    filename: grafana
    state: present
  register: grafana_repo
  retries: 10
  until: grafana_repo is success

### Pkg: apt ops

- name: Install required packages
  apt:
    name:
      - grafana
      - jq
      - telegraf
      - influxdb2
      - influxdb2-cli
      - wget
    state: present
    install_recommends: no
  register: apt_4
  retries: 10
  until: apt_4 is success
  tags: packages

### Generate new-host-only local credentials

- name: Prepare local metrics credential storage
  file:
    path: /etc/brev
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Check for persisted local metrics credentials
  stat:
    path: /etc/brev/metrics-secrets.env
  register: metrics_secrets_file

- name: Start InfluxDB before checking initialization state
  service:
    name: influxdb
    state: started
    enabled: yes

- name: Wait for the InfluxDB setup endpoint
  uri:
    url: http://127.0.0.1:8086/api/v2/setup
    return_content: true
  register: influx_setup_state
  retries: 45
  delay: 2
  until: influx_setup_state.status == 200

- name: Refuse automatic credential changes on an initialized host
  fail:
    msg: >-
      InfluxDB is already initialized but /etc/brev/metrics-secrets.env is absent.
      Refusing to rotate or replace credentials on an existing host.
  when:
    - not metrics_secrets_file.stat.exists
    - not (influx_setup_state.json.allowed | bool)

- name: Generate independent local credentials for a new host
  shell: |
    set -euo pipefail
    umask 077
    secret_file=/etc/brev/metrics-secrets.env
    secret_tmp=$(mktemp /etc/brev/.metrics-secrets.XXXXXX)
    random_secret() {
      od -An -N24 -tx1 /dev/urandom | tr -d ' \n'
    }
    printf '%s\n' \
      "INFLUX_ADMIN_PASSWORD=$(random_secret)" \
      "INFLUX_OPERATOR_TOKEN=$(random_secret)" \
      "INFLUX_V1_PASSWORD=$(random_secret)" \
      "GRAFANA_ADMIN_PASSWORD=$(random_secret)" \
      > "$secret_tmp"
    chown root:root "$secret_tmp"
    chmod 0600 "$secret_tmp"
    mv "$secret_tmp" "$secret_file"
  args:
    executable: /bin/bash
    creates: /etc/brev/metrics-secrets.env
  no_log: true

- name: Verify local metrics credential file protection
  stat:
    path: /etc/brev/metrics-secrets.env
  register: metrics_secrets_file_verified
  failed_when: >-
    not metrics_secrets_file_verified.stat.exists
    or metrics_secrets_file_verified.stat.pw_name != 'root'
    or metrics_secrets_file_verified.stat.gr_name != 'root'
    or metrics_secrets_file_verified.stat.mode != '0600'

- name: Read local metrics credentials
  slurp:
    src: /etc/brev/metrics-secrets.env
  register: metrics_secrets_content
  no_log: true

- name: Parse local metrics credentials
  set_fact:
    metrics_secrets: >-
      {{ dict((metrics_secrets_content.content | b64decode)
              | regex_findall('(?m)^([A-Z0-9_]+)=([0-9a-f]+)$')) }}
  no_log: true

- name: Validate independent local metrics credentials
  assert:
    that:
      - metrics_secrets.INFLUX_ADMIN_PASSWORD | length == 48
      - metrics_secrets.INFLUX_OPERATOR_TOKEN | length == 48
      - metrics_secrets.INFLUX_V1_PASSWORD | length == 48
      - metrics_secrets.GRAFANA_ADMIN_PASSWORD | length == 48
      - metrics_secrets.values() | unique | length == 4
  no_log: true

### Configure influxdb2

- name: Configure influxdb
  #ignore_errors: yes # Do not fail on metrics config
  block:
    - name: Start and enable influxdb2 service
      service:
        name: influxdb
        state: started
        enabled: yes

    - name: Setup influxdb2 user
      shell: |
        INFLUX_BUCKET_ID=`influx bucket list | grep {{ influx.bucket }} | awk '{print($1)}'`
        [ -z "$INFLUX_BUCKET_ID" ] && influx setup --username {{ influx.username }} --password {{ metrics_secrets.INFLUX_ADMIN_PASSWORD }} --org {{ influx.org }} --bucket {{ influx.bucket }} --retention 30d --token {{ metrics_secrets.INFLUX_OPERATOR_TOKEN }} -force || echo "Bucket found with ID ${INFLUX_BUCKET_ID}"
      no_log: true # Prevent logging of sensitive credentials

    - name: Setup influxdb1 user
      shell: |
        INFLUX_BUCKET_ID=`influx bucket list | grep {{ influx.bucket }} | awk '{print($1)}'`
        INFLUX_AUTH_ID=`influx v1 auth list | grep {{ influx.bucket }} | awk '{print($1)}'`
        [ -z "$INFLUX_AUTH_ID" ] && influx v1 auth create --username {{ influx.username }} --password {{ metrics_secrets.INFLUX_V1_PASSWORD }} --org {{ influx.org }} --read-bucket ${INFLUX_BUCKET_ID} || echo "Auth found with ID ${INFLUX_AUTH_ID}"
      no_log: true # Prevent logging of sensitive credentials

### Configure telegraf

- name: Configure telegraf
  #ignore_errors: yes # Do not fail on metrics config
  block:
    - name: Copy telegraf vars configuration
      template:
        src: telegraf/telegraf-default
        dest: /etc/default/telegraf
        owner: telegraf
        group: telegraf
        mode: "0640"

    - name: Conf template for grafana datasource conf
      template:
        src: telegraf/telegraf.conf
        dest: /etc/telegraf/telegraf.conf
      no_log: true

    - name: Add telegraf user to adm group
      user:
        name: telegraf
        groups: adm
        append: yes

    - name: Set ownership and permissions on telegraf directory
      file:
        path: /etc/telegraf
        owner: telegraf
        group: telegraf
        mode: "0750"
        recurse: yes

    - name: Set permissions on telegraf configuration file
      file:
        path: /etc/telegraf/telegraf.conf
        mode: "0640"

    - name: Start and enable telegraf service
      service:
        name: telegraf
        state: restarted
        enabled: yes

### Configure grafana
- name: Configure grafana
  #ignore_errors: yes # Do not fail on metrics config
  block:
    - name: Conf template for grafana ini
      template:
        src: grafana/grafana.ini
        dest: /etc/grafana/grafana.ini
        owner: root
        group: grafana
        mode: "0640"
      no_log: true

    - name: Conf template for grafana datasource conf
      template:
        src: grafana/datasource.yaml
        dest: /etc/grafana/provisioning/datasources/graf_ds.yaml
        owner: root
        group: grafana
        mode: "0640"
      no_log: true

    - name: Conf template for grafana dashboard conf
      template:
        src: grafana/dashboard.yaml
        dest: /etc/grafana/provisioning/dashboards/graf_dash.yaml

    - name: Ensure grafana dashboard dir exists
      file:
        path: /var/lib/grafana/dashboards
        state: directory

    - name: Stage pre-baked grafana dashboard JSON model
      template:
        src: grafana/dashboard.json
        dest: /var/lib/grafana/dashboards/metrics.json

    - name: Start and enable grafana service
      service:
        name: grafana-server
        state: restarted
        enabled: yes
